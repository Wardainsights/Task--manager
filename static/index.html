<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTask Manager</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 400px;
            text-align: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #00dbde;
            background: linear-gradient(90deg, #00dbde 0%, #fc00ff 100%);
            border: none;
            padding: 10px 15px;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 ProTask Manager</h1>
        <p>Full-Stack FastAPI & SQLite Web App</p>
        
        <div class="stats">
            <span id="total-tasks">Total: 0</span>
            <span id="pending-tasks">Pending: 0</span>
        </div>

        <div class="input-group">
            <input type="text" id="task-input" placeholder="Type a new task here...">
            <button onclick="addTask()">Add Task</button>
        </div>
    </div>

    <script>
        // Aap yahan apni JavaScript logic mazeed add kar sakti hain
    </script>
</body>
</html>
